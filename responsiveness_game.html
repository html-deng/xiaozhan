<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小站 -- 反应力挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            min-height: 100vh;
            background: url('/image/background.png') center/cover no-repeat;
            position: relative;
            overflow: hidden;
        }
        /* 半透明暖橙色遮罩，让背景和游戏元素更协调 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 140, 0, 0.25);
            backdrop-filter: blur(1px);
        }
        .game-container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background-color: rgba(255, 248, 220, 0.9);
            border-radius: 20px;
            border: 3px solid #ff7700;
            box-shadow: 0 8px 32px rgba(255, 102, 0, 0.4);
            text-align: center;
        }
        h1 {
            color: #cc5500;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        .info-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #fff3e0;
            border-radius: 12px;
        }
        .info-item {
            font-size: 1.2rem;
            color: #8b4513;
            font-weight: bold;
        }
        .game-area {
            width: 100%;
            height: 350px;
            background-color: rgba(255, 228, 181, 0.6);
            border-radius: 15px;
            position: relative;
            border: 2px dashed #ff8800;
            cursor: crosshair;
        }
        .target {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff6600, #ffaa00);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.6);
            cursor: pointer;
            animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }
        .btn-group {
            margin-top: 25px;
        }
        button {
            padding: 12px 35px;
            margin: 0 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(90deg, #ff7700, #ff4400);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 68, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="game-container">
        <h1>🌾 小站--反应力挑战</h1>
        <div class="info-board">
            <div class="info-item">得分：<span id="score">0</span></div>
            <div class="info-item">剩余时间：<span id="timer">30</span>s</div>
            <div class="info-item">最快反应：<span id="best-time">--</span>ms</div>
        </div>
        <div class="game-area" id="gameArea"></div>
        <div class="btn-group">
            <button id="startBtn">开始游戏</button>
            <button id="resetBtn">重置游戏</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const bestTimeEl = document.getElementById('best-time');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        let score = 0;
        let timeLeft = 30;
        let bestReactionTime = Infinity;
        let gameRunning = false;
        let timerInterval, targetSpawnInterval;
        let targetAppearTime = 0;

        // 生成随机点击目标
        function createTarget() {
            if (!gameRunning) return;
            // 移除已有目标
            document.querySelector('.target')?.remove();

            const target = document.createElement('div');
            target.classList.add('target');
            // 随机生成目标位置
            const maxX = gameArea.clientWidth - 50;
            const maxY = gameArea.clientHeight - 50;
            target.style.left = Math.random() * maxX + 'px';
            target.style.top = Math.random() * maxY + 'px';
            
            // 记录目标生成时间
            targetAppearTime = Date.now();

            // 点击目标触发得分逻辑
            target.addEventListener('click', () => {
                const reactionTime = Date.now() - targetAppearTime;
                score++;
                scoreEl.textContent = score;
                if (reactionTime < bestReactionTime) {
                    bestReactionTime = reactionTime;
                    bestTimeEl.textContent = reactionTime;
                }
                target.remove();
            });

            gameArea.appendChild(target);
        }

        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            score = 0;
            timeLeft = 30;
            bestReactionTime = Infinity;
            scoreEl.textContent = 0;
            timerEl.textContent = 30;
            bestTimeEl.textContent = '--';

            // 倒计时逻辑
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(targetSpawnInterval);
                    gameRunning = false;
                    document.querySelector('.target')?.remove();
                    alert(`游戏结束！你的最终得分是 ${score} 分`);
                }
            }, 1000);

            // 每隔1.2秒生成一个新目标
            targetSpawnInterval = setInterval(createTarget, 1000);
        }

        // 重置游戏
        function resetGame() {
            clearInterval(timerInterval);
            clearInterval(targetSpawnInterval);
            gameRunning = false;
            score = 0;
            timeLeft = 30;
            bestReactionTime = Infinity;
            scoreEl.textContent = 0;
            timerEl.textContent = 30;
            bestTimeEl.textContent = '--';
            document.querySelector('.target')?.remove();
        }

        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
