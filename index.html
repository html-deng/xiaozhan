<!DOCTYPE html>
<html lang="zh-CN">
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="/xiaozhan/CSS/home.css">   <!--/xiaozhan-->
        <title>小站</title>
    </head>   
    <body>
        <h1>HI,这是我的个人小站,小站每天都会更新!</h1>
        <h4 id="title">欢迎来到小站！！！</h4>

        <script>
            var title = document.getElementById("title")
            var vocabulary = ["真的有人会看这里吗？", "欢迎来到小站！！！", "今天又是活力满满的一天啊！", "你好，欢迎来看我的小站！！!","今天天气真好,你想出去运动吗?"];
            function randow_number(min,max){
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function obtain(){
                var display = vocabulary[randow_number(0,4)]
                title.textContent = display
            }

            function title_display(){
                setTimeout(() => {
                    obtain()
                    title_display()
                },5000)   
            }

            title_display()
        </script> 
    </body>
</html>
